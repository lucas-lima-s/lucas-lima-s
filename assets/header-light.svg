<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" preserveAspectRatio="xMinYMid meet" role="img" aria-label="Lucas de Lima, Tech Lead, full-stack engineer working with Python, .NET, Node and React">
  <rect width="900" height="180" fill="none"/>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .name { font-size: 40px; fill: #1f2328; }
    .role { font-size: 18px; fill: #59636e; }
    .accent { fill: #0969da; animation: grow 1.2s ease-out forwards; }
    .cursor { fill: #1f2328; animation: blink 1.06s step-end infinite; }
    .dot { fill: #2da44e; animation: pulse 2.4s ease-in-out infinite; }
    .dot:nth-child(1) { animation-delay: 0.0s; }
    .dot:nth-child(2) { animation-delay: 0.1s; }
    .dot:nth-child(3) { animation-delay: 0.2s; }
    .dot:nth-child(4) { animation-delay: 0.3s; }
    .dot:nth-child(5) { animation-delay: 0.4s; }
    .dot:nth-child(6) { animation-delay: 0.5s; }
    .dot:nth-child(7) { animation-delay: 0.6s; }
    .dot:nth-child(8) { animation-delay: 0.7s; }
    .dot:nth-child(9) { animation-delay: 0.8s; }
    .dot:nth-child(10) { animation-delay: 0.9s; }
    .dot:nth-child(11) { animation-delay: 1.0s; }
    .dot:nth-child(12) { animation-delay: 1.1s; }
    @keyframes grow {
      from { width: 0; }
      to { width: 420px; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <text x="24" y="64" class="name">Lucas de Lima</text>
  <rect x="24" y="76" width="420" height="3" class="accent"/>
  <text x="24" y="106" class="role">Tech Lead | Full-stack (Python, .NET, Node, React)</text>
  <rect x="582" y="90" width="10" height="20" class="cursor"/>
  <g>
    <rect x="24" y="136" width="10" height="10" rx="2" class="dot"/>
    <rect x="38" y="136" width="10" height="10" rx="2" class="dot"/>
    <rect x="52" y="136" width="10" height="10" rx="2" class="dot"/>
    <rect x="66" y="136" width="10" height="10" rx="2" class="dot"/>
    <rect x="80" y="136" width="10" height="10" rx="2" class="dot"/>
    <rect x="94" y="136" width="10" height="10" rx="2" class="dot"/>
    <rect x="108" y="136" width="10" height="10" rx="2" class="dot"/>
    <rect x="122" y="136" width="10" height="10" rx="2" class="dot"/>
    <rect x="136" y="136" width="10" height="10" rx="2" class="dot"/>
    <rect x="150" y="136" width="10" height="10" rx="2" class="dot"/>
    <rect x="164" y="136" width="10" height="10" rx="2" class="dot"/>
    <rect x="178" y="136" width="10" height="10" rx="2" class="dot"/>
  </g>
</svg>
